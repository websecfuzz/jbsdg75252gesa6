version: "2"

services:
  dbproxy:
    image: python:3.10-slim
    container_name: proxy_python_app
    volumes:
      - ../../shared-data:/shared-data
      - ../proxy:/proxy
    command: python /proxy/sql_proxy.py
    environment:
      - PYTHONUNBUFFERED=1
      - WUT_NAME=${WUT_NAME}
      - DB_CONTAINER_NAME=db
      - HOST_NAME=${HOST_NAME}
    depends_on:
      - db


  server:
    build:
      context: .
      dockerfile_inline: |
        #FROM docker.gitea.com/gitea:1.24.5-rootless
        FROM gitea/gitea:1.24.5-rootless
        COPY ./_resources/app.ini /etc/gitea/app.ini
    restart: always
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8081:3000"
      - "2222:2222"
    depends_on:
      - db

  db:
    build:
      context: .
      dockerfile_inline: |
        FROM mysql:8.4.0
        COPY ./_resources/db.sql /docker-entrypoint-initdb.d/db.sql
    command: mysqld
    environment:
      MYSQL_DATABASE: gitea
      MYSQL_USER: gitea
      MYSQL_PASSWORD: gitea
      MYSQL_ROOT_PASSWORD: gitea
      MYSQL_ROOT_HOST: "%"
      MYSQL_USER_HOST: "%"
