services:
  dbproxy:
    build:
      context: .
      dockerfile_inline: |
        FROM mysql:8.4.0
        COPY ./db/data.sql /docker-entrypoint-initdb.d/db.sql
    command: mysqld
    environment:
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: "%"
      MYSQL_USER_HOST: "%"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - db

  adminer:
    image: adminer
    restart: always
    ports:
      - 8801:8080
      
  web:
    build:
      context: ../
      dockerfile: Dockerfile.PHP81
      args:
        APP: bwapp        
    command: ["/usr/sbin/apache2ctl", "-D", "FOREGROUND"]
    depends_on:
      dbproxy:
        condition: service_healthy
    ports:
      - 8081:80
