services:
  db:
    build:
      context: .
      dockerfile_inline: |
        FROM mysql:8.4.0
        COPY ./_resources/db.sql /docker-entrypoint-initdb.d/db.sql
    command: mysqld
    environment:
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: "%"
      MYSQL_USER_HOST: "%"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
    networks:
      default:
        aliases:
          - dbproxy

  adminer:
    image: adminer
    restart: always
    ports:
      - 8801:8080

  web:
    build:
      context: ../
      dockerfile: Dockerfile.PHP81
      args:
        APP: wordpress3
    container_name: web
    command: ["/usr/sbin/apache2ctl", "-D", "FOREGROUND"]
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
