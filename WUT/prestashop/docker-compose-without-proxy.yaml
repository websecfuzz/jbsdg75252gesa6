services:
  adminer:
    image: adminer
    restart: always
    ports:
      - 8801:8080
      
  db:
    build:
      context: .
      dockerfile_inline: |
        FROM mysql:8.4.0
        COPY ./_resources/db.sql /docker-entrypoint-initdb.d/db.sql
    command: mysqld
    environment:
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: "%"
      MYSQL_USER_HOST: "%"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
    networks:
      default:
        aliases:
          - dbproxy
      

  web:
    build:
      context: .
      dockerfile_inline: |
        FROM chialab/php:8.1-apache
        COPY . /var/www/html/
        RUN chown -R www-data:www-data /var/www/html/var && chmod -R 775 /var/www/html/var
        RUN rm -rf /var/www/html/var/cache/*
        
    container_name: prestashop
    command: ["/usr/sbin/apache2ctl", "-D", "FOREGROUND"]
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
